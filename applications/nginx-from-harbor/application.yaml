apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-from-harbor
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/guymeltzer/homelab-gitops
    targetRevision: HEAD
    path: applications/nginx-from-harbor
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
