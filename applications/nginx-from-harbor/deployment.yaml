apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-from-harbor
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-harbor
  template:
    metadata:
      labels:
        app: nginx-harbor
    spec:
      containers:
      - name: nginx
        image: 172.18.0.6:30002/homelab/nginx:alpine
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-from-harbor
  namespace: default
spec:
  type: NodePort
  selector:
    app: nginx-harbor
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30081
