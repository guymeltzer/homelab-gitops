apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    targetRevision: 4.11.3
    helm:
      values: |
        controller:
          # Service configuration - MUST be explicit
          service:
            enabled: true
            type: NodePort
            ports:
              http: 80
              https: 443
            targetPorts:
              http: http
              https: https
            nodePorts:
              http: 30080
              https: 30443
          
          # NO hostPort for Kind with NodePort
          hostPort:
            enabled: false
          
          # Disable admission webhooks for simplicity
          admissionWebhooks:
            enabled: false
          
          # Metrics for Prometheus
          metrics:
            enabled: true
            service:
              annotations:
                prometheus.io/scrape: "true"
                prometheus.io/port: "10254"
          
          # Resource limits
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          
          # Pod configuration
          ingressClassResource:
            name: nginx
            enabled: true
            default: true
  
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

