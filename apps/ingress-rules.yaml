apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-rules
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/guymeltzer/homelab-apps
    targetRevision: main
    path: .
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
