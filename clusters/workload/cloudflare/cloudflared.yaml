---
apiVersion: v1
kind: Namespace
metadata:
  name: cloudflare
---
apiVersion: v1
kind: Secret
metadata:
  name: cloudflared-token
  namespace: cloudflare
type: Opaque
stringData:
  token: eyJhIjoiNGE1NTRlYzFmMmQzNjExNmExMmE5NWMzYWNkOGYyZWMiLCJ0IjoiMTcwNTVkMmEtMjVjZC00ZmNiLWJkNjgtNzUyZTgwNzhmOTYxIiwicyI6IlpqRmpZakF6T1RBdE56aGxZaTAwWm1JeExXRXpPR1V0WmpCalpUVTBZelU1WTJGaSJ9
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: cloudflare
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      containers:
      - name: cloudflared
        image: cloudflare/cloudflared:latest
        args:
        - tunnel
        - --no-autoupdate
        - run
        - --token
        - $(TUNNEL_TOKEN)
        env:
        - name: TUNNEL_TOKEN
          valueFrom:
            secretKeyRef:
              name: cloudflared-token
              key: token
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /metrics
            port: 2000
          initialDelaySeconds: 30
          periodSeconds: 30
          failureThreshold: 3
